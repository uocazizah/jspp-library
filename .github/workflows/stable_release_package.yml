name: Publish Package

on:
  push:
    branches:
      - master
      - canary

  # Allow manual execution from the GitHub Actions UI.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# Prevent multiple publish jobs from running simultaneously.
concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      # Check out the current branch.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Install the requested Node.js version.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # Install project dependencies.
      - name: Install dependencies
        run: npm ci

      # Run the test suite.
      - name: Run build
        run: npm run build && npm run build:test

      # Build the package before publishing.
      - name: Run tests
        run: npm run test

      # Generate a unique canary version using the GitHub run number.
      - name: Prepare Canary Version
        if: github.ref_name == 'canary'
        shell: bash
        run: |
          node <<'EOF'
          const fs = require('fs');

          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));

          // Remove any existing prerelease suffix.
          const base = pkg.version.split('-')[0];

          // Generate a unique canary version.
          pkg.version = `${base}-canary.${process.env.GITHUB_RUN_NUMBER}`;

          fs.writeFileSync(
            'package.json',
            JSON.stringify(pkg, null, 2) + '\n'
          );

          console.log("Canary Version:", pkg.version);
          EOF

      # Read package name and version from package.json.
      - name: Read package metadata
        id: pkg
        shell: bash
        run: |
          echo "name=$(node -p "require('./package.json').name")" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # Skip publishing if the version already exists on npm.
      - name: Check existing npm version
        id: check
        shell: bash
        run: |
          if npm view "${{ steps.pkg.outputs.name }}@${{ steps.pkg.outputs.version }}" version >/dev/null 2>&1
          then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Version already exists."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Generate an SPDX SBOM for the package.
      - name: Generate SBOM
        if: steps.check.outputs.exists == 'false'
        run: npm sbom --sbom-format spdx --sbom-type library sbom.spdx.json

      # Publish stable releases from the master branch.
      - name: Publish Stable
        if: |
          github.ref_name == 'master' &&
          steps.check.outputs.exists == 'false'
        run: |
          npm stage publish \
            --tag latest \
            --access public \
            --provenance

      # Publish canary releases from the canary branch.
      - name: Publish Canary
        if: |
          github.ref_name == 'canary' &&
          steps.check.outputs.exists == 'false'
        run: |
          npm publish \
            --tag canary \
            --access public \
            --provenance
