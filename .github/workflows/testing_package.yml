name: Testing Package

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.x

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Build tests
        run: npm run build:test

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          if-no-files-found: error

  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node-version }}
    needs: build
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu x86_64
          - os: ubuntu-latest
            node-version: 26.x
          - os: ubuntu-latest
            node-version: 25.x
          - os: ubuntu-latest
            node-version: 24.x
          - os: ubuntu-latest
            node-version: 23.x
          - os: ubuntu-latest
            node-version: 22.x
          - os: ubuntu-latest
            node-version: 21.x
          - os: ubuntu-latest
            node-version: 20.x
          - os: ubuntu-latest
            node-version: 19.x
          - os: ubuntu-latest
            node-version: 18.x
          - os: ubuntu-latest
            node-version: 17.x

          # Ubuntu ARM64
          - os: ubuntu-26.04-arm
            node-version: 26.x

          # Windows
          - os: windows-latest
            node-version: 26.x

          # macOS
          - os: macos-latest
            node-version: 26.x

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Run tests
        run: npm test
