name: Testing Package

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  test-package:
    name: ${{ matrix.os }} / Node ${{ matrix.node-version }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu x86_64
          - os: ubuntu-latest
            node-version: 26.x
          - os: ubuntu-latest
            node-version: 25.x
          - os: ubuntu-latest
            node-version: 24.x
          - os: ubuntu-latest
            node-version: 23.x
          - os: ubuntu-latest
            node-version: 22.x
          - os: ubuntu-latest
            node-version: 21.x
          - os: ubuntu-latest
            node-version: 20.x
          - os: ubuntu-latest
            node-version: 19.x
          - os: ubuntu-latest
            node-version: 18.x
          - os: ubuntu-latest
            node-version: 17.x

          # Ubuntu 26.04 ARM64 (preview, only use current for now)
          - os: ubuntu-26.04-arm
            node-version: 26.x

          # Windows (Current only)
          - os: windows-latest
            node-version: 26.x

          # macOS (Current only)
          - os: macos-latest
            node-version: 26.x

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Tests
        run: npm test
